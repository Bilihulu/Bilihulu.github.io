function renderHeader(){document.documentElement.lang=zh()?'zh-CN':'en';$('header').innerHTML=`<div class="brand"><div class="brandmark"><span>山</span></div><div><strong>${tr('山海','SHANHAI')}</strong><small>BEASTBOUND · ${tr('万兽契约','MYTHIC ADVENTURE')}</small></div></div><div class="wallet"><div class="money" title="${tr('灵玉：用于召唤','Jade: used for summoning')}"><span>◇</span><b>${S.jade}</b><small>${tr('灵玉','Jade')}</small></div><div class="money" title="${tr('灵蕴：用于升级','Essence: used for leveling')}"><span style="color:var(--gold)">✧</span><b>${S.essence}</b><small>${tr('灵蕴','Essence')}</small></div><div class="money" title="${tr('修为：提升全队属性','Cultivation: boosts your party')}"><span style="color:var(--gold)">☯</span><b>${REALMS[Math.min(9,S.cult-1)][zh()?0:1]}</b><small>${tr('修为','Cult')}</small></div></div><button class="tool" data-action="lang" aria-label="${tr('切换为英文','Switch to Chinese')}">${tr('EN','中')}</button><button class="tool ${S.sound?'sound-on':''}" data-action="sound" aria-label="${tr('切换音效','Toggle sound')}">${S.sound?'♪':'♩'}</button><button class="tool" data-action="guide" aria-label="${tr('玩法说明','How to play')}">?</button><button class="tool" data-action="settings" aria-label="${tr('设置','Settings')}">⚙</button>`;
$('nav').innerHTML=[['summon','01',tr('唤灵台','Summon')],['explore','02',tr('山海行','Explore')],['codex','03',tr('万兽录','Beasts')],['forge','04',tr('炼化台','Forge')],['cult','05',tr('修行','Cultivate')]].map(([id,n,l])=>`<button data-action="tab" data-id="${id}" class="${tab===id?'active':''}" ${tab===id?'aria-current="page"':''}><small>${n}</small>${l}</button>`).join('')+`<span class="chapter-tag"><i class="dot"></i>${tr('山海绘卷 · 第一卷','THE FIRST SCROLL')}</span>`;
$('footer').innerHTML=`<span>${tr('山海有灵，万物有契。','Every mountain holds a spirit. Every bond tells a story.')}</span><span>${storageOK?tr('进度自动保存','Progress saved automatically'):tr('浏览器无法保存，请勿关闭页面','Storage unavailable — keep this page open')} · <button data-action="about">${tr('关于这卷山海','About the scroll')}</button></span>`;}
function renderIntro(){const r=REALMS[Math.min(9,S.cult-1)];$('main').innerHTML=`<section class="page intro"><div class="intro-inner"><div class="intro-art">${artHero()}</div><div class="intro-copy"><div class="eyebrow">SHANHAI · BEASTBOUND</div><h1 class="intro-title">${tr('山海 · 万兽契约','Shanhai: Beastbound')}</h1><p class="intro-sub">${tr('上古洪荒，万兽奔走于山海之间。','In the age of myth, spirits roamed the mountains and seas.')}</p><p class="intro-desc">${tr('你是遗失绘卷的执笔人。循着残卷踏入这片土地，以修行温养契约，于探险中亲手收服神兽，以炼化凝练更高之灵。','You are the scribe of a lost scroll. Cultivate your spirit, bond with beasts through exploration, and forge higher forms from what you gather.')}</p><button class="btn primary wide" data-action="start">${tr('踏入山海 · 开始修行','Enter the realm')} <span>→</span></button><div class="intro-foot">${tr('无灵兽开局 · 神兽皆由你亲手收服','No starter beast · Collect every spirit yourself')}</div></div></div></section>`;}
function render(){document.body.classList.toggle('calm',!!S.calm);while(S.clears.length<REGIONS.length)S.clears.push(0);renderHeader();if(!S.started){renderIntro();CG.sync();return;}if(tab==='summon')renderSummon();else if(tab==='codex')renderCodex();else if(tab==='forge')renderForge();else if(tab==='cult')renderCult();else renderExplore();CG.sync();}
function renderSummon(){$('main').innerHTML=`<section class="page"><div class="summon-layout"><div class="hero"><div class="landscape">${landscape()}</div><div class="hero-copy"><div class="eyebrow">THE CALL OF QINGQIU</div><h1>${tr('山海有灵<br>待你唤醒','Ancient spirits.<br>New bonds.')}</h1><p class="hero-desc">${tr('展开遗失的山海绘卷，与上古异兽结契，走入云海深处。','Unfurl a forgotten scroll. Bond with mythical beasts. Venture beyond the mist.')}</p><div class="feature"><span class="tag">${tr('上古','MYTHIC')}</span><strong>${tr('九尾狐','Nine-Tailed Fox')}</strong></div></div><div class="hero-art">${art('fox',true)}</div><div class="hero-caption">青丘之山 · 有兽焉 · 其状如狐而九尾</div><div class="hero-bottom"><span>${tr('青丘之约 / 万兽皆可收集','THE QINGQIU COVENANT / COLLECT EVERY SPIRIT')}</span><div class="hero-dots"><i></i><i></i><i></i></div></div></div><aside class="ritual"><div class="eyebrow">THE SUMMONING RITUAL</div><h2>${tr('以玉为引 · 结契山海','A bond beyond the mist')}</h2><p>${tr('以灵玉唤醒沉睡之灵，重复结契会转化为觉醒星尘。','Awaken a sleeping spirit with Jade. Duplicate bonds become Stardust for awakening.')}</p><div class="ritual-seal"><span>契</span></div><button class="btn primary wide" data-action="summon" data-n="1" ${S.jade<100?'disabled':''}>${tr('结契一次','Summon one')} <span>◇ 100</span></button><button class="btn secondary wide" data-action="summon" data-n="3" ${S.jade<300?'disabled':''}>${tr('三连结契','Summon three')} <span>◇ 300</span></button>${CG.ready?`<button class="btn secondary wide" data-action="adjade">${tr('观看广告 · 领 100 灵玉','Watch an ad · +100 Jade')}</button>`:''}<div class="pity"><span>${tr('上古契约保底','Mythic guarantee')}</span><span>${S.pity} / 10</span></div><div class="meter"><i style="width:${S.pity*10}%"></i></div><p class="prob">${tr('上古 8% · 神兽 27% · 灵兽 65%<br>至多十抽必得上古 · 初始契约不计入保底','Mythic 8% · Divine 27% · Spirit 65%<br>Mythic within 10 pulls · Starter bonds excluded')}</p></aside></div><div class="section-title"><h2>${tr('山海异闻','Spirits of the scroll')}</h2><span>${tr('邂逅你的命定神兽','Find your kindred spirit')}</span><button data-action="tab" data-id="codex">${tr('万兽图鉴','View all beasts')} ↗</button></div><div class="featured">${DATA.slice(0,6).map(b=>card(b)).join('')}</div>${S.started?`<div class="hint-line">${tr('下一站：带上你的三兽小队，探索青丘之森。战斗与奇遇都会带来新的灵玉。','Next: take your party into Mistwood. Battles and encounters earn more Jade.')} <button data-action="tab" data-id="explore" style="color:var(--gold)">${tr('出发 →','Explore →')}</button></div>`:''}</section>`;}
function teamStrip(){return `<div class="team-strip">${[0,1,2].map((_,i)=>{const id=S.team[i];return `<button class="team-slot" data-action="${id?'detail':'tab'}" data-id="${id||'codex'}">${id?`<div class="art">${art(id)}</div><div><strong>${name(DB[id])}</strong><small>Lv.${S.own[id].lv} · ${elname(DB[id].el)} · ${ROLES[role(id)][2]} · ${'✦'.repeat(S.own[id].star)}</small></div>`:`<span class="muted">＋ ${tr('选择神兽','Add a beast')}</span>`}<span class="index">0${i+1}</span></button>`}).join('')}</div>`;}
function renderCodex(){let list=DATA.filter(b=>filter==='all'||filter==='owned'&&S.own[b.id]||String(b.el)===filter||filter==='r:'+role(b.id));$('main').innerHTML=`<section class="page"><div class="content-head"><div><div class="eyebrow">THE BESTIARY</div><h1>${tr('万兽录','The bestiary')}</h1><p>${tr('结契、养成、觉醒。让每一只神兽找到自己的位置。','Collect, nurture and awaken. Every spirit has a place in your party.')}</p></div><span class="badge">${Object.keys(S.own).length} / ${DATA.length} ${tr('已结契','bonded')} · ✦ ${S.stardust} ${tr('星尘','Stardust')}</span></div>${teamStrip()}<div class="filters">${[['all',tr('全部','All')],['owned',tr('已结契','Owned')],...ELS.map((e,i)=>[String(i),e[zh()?0:1]]),...Object.keys(ROLES).map(r=>['r:'+r,ROLES[r][2]+' '+rname(r)])].map(([id,n])=>`<button class="chip ${id===filter?'active':''}" data-action="filter" data-id="${id}">${n}</button>`).join('')}</div><div class="codex-grid">${list.map(b=>card(b,{locked:!S.own[b.id]})).join('')}</div>${!list.length?`<div class="empty">${tr('绘卷尚未点亮，先去唤灵台用灵玉召唤你的第一只神兽。','Your scroll awaits its first spirit. Summon your first beast in Summon.')}</div>`:''}<p class="hint-line">${tr('五行相克：木 → 土 → 水 → 火 → 金 → 木。克制伤害 +25%，被克制伤害 -15%。','Elements: Wood → Earth → Water → Fire → Metal → Wood. Advantage +25% damage; disadvantage −15%.')}</p></section>`;}
function artHero(){const uid='h'+(++artSerial);return `<svg viewBox="0 0 320 300" aria-hidden="true"><defs><linearGradient id="${uid}g" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#f3e5bb"/><stop offset=".5" stop-color="#e1be78"/><stop offset="1" stop-color="#9a7b3f"/></linearGradient><radialGradient id="${uid}r" cx=".5" cy=".42" r=".6"><stop stop-color="#97d2ba55"/><stop offset="1" stop-color="#97d2ba00"/></radialGradient></defs><circle cx="160" cy="150" r="130" fill="url(#${uid}r)"/><circle cx="160" cy="150" r="128" fill="none" stroke="#e0d4a63a"/><circle cx="160" cy="150" r="112" fill="none" stroke="#e0d4a621" stroke-dasharray="2 7"/><ellipse cx="160" cy="280" rx="86" ry="9" fill="#041c2526"/><path d="M160 150 C120 150 96 176 92 232 L80 284 L240 284 L228 232 C224 176 200 150 160 150Z" fill="url(#${uid}g)" stroke="#7c6332" stroke-opacity=".4"/><path d="M160 150 L138 202 L160 218 L182 202Z" fill="#172b30" opacity=".85"/><path d="M138 202 L160 218 L160 150 L120 168Z" fill="#0f2024" opacity=".92"/><rect x="104" y="224" width="112" height="16" rx="8" fill="#97d2ba" opacity=".9"/><path d="M120 206 C108 222 120 237 139 233" fill="none" stroke="url(#${uid}g)" stroke-width="20" stroke-linecap="round"/><path d="M200 206 C212 222 200 237 181 233" fill="none" stroke="url(#${uid}g)" stroke-width="20" stroke-linecap="round"/><circle cx="160" cy="224" r="21" fill="#cdeede" stroke="#97d2ba" stroke-width="3"/><circle cx="160" cy="224" r="21" fill="none" stroke="#ffffff" stroke-opacity=".5"/><path d="M160 211 q9 7 0 26" stroke="#ffffff" stroke-opacity=".55" fill="none" stroke-width="2"/><rect x="150" y="138" width="20" height="20" fill="#e9d2a0"/><circle cx="160" cy="112" r="41" fill="#f3e5bb"/><circle cx="160" cy="112" r="41" fill="none" stroke="#caa86a" stroke-opacity=".5"/><path d="M120 104 C116 68 204 68 200 104 C200 86 188 78 160 78 C132 78 120 86 120 104Z" fill="#2c2620"/><path d="M160 70 C144 70 138 58 150 52 C159 48 162 48 170 52 C182 58 176 70 160 70Z" fill="#2c2620"/><circle cx="160" cy="54" r="9" fill="#2c2620"/><path d="M160 48 q-13 -3 -15 8 q11 -3 15 -3 q4 0 15 3 q-2 -11 -15 -8Z" fill="#caa86a" opacity=".7"/><path d="M146 110 q6 5 12 0" fill="none" stroke="#163b40" stroke-width="2.4"/><path d="M162 110 q6 5 12 0" fill="none" stroke="#163b40" stroke-width="2.4"/><circle cx="148" cy="111" r="1.8" fill="#163b40"/><circle cx="174" cy="111" r="1.8" fill="#163b40"/><path d="M151 126 q9 7 18 0" fill="none" stroke="#b9765a" stroke-width="2.2" stroke-linecap="round"/><circle cx="137" cy="120" r="5" fill="#ef9c86" opacity=".5"/><circle cx="183" cy="120" r="5" fill="#ef9c86" opacity=".5"/></svg>`;}
function forgeTile(b){const o=S.own[b.id];return `<button class="beast-card ${forgeSel.includes(b.id)?'sel':''}" data-action="forge-pick" data-id="${b.id}" aria-label="${name(b)}"><span class="rarity">${rarity(b.rarity)}</span><span class="element">${elname(b.el)}</span><div class="art">${art(b.id)}</div><h3>${name(b)}</h3><div class="subtitle">Lv.${o.lv} · ${'✦'.repeat(o.star)}</div></button>`;}
function renderForge(){const owned=DATA.filter(b=>S.own[b.id]);const sameEl=forgeSel.length===2&&DB[forgeSel[0]].el===DB[forgeSel[1]].el;const maxT=forgeSel.length===2?Math.max(DB[forgeSel[0]].rarity,DB[forgeSel[1]].rarity):0;let preview;if(forgeSel.length<2)preview=tr('选择两只同系神兽投入炼妖炉','Pick two same-element beasts for the crucible');else if(!sameEl)preview=tr('⚠ 需同系（五行相同）','⚠ Need the same element');else if(S.jade<60)preview=tr('灵玉不足（需 60）','Need 60 Jade');else preview=maxT<2?tr('结果：随机 '+rarity(maxT+1)+' · '+elname(DB[forgeSel[0]].el),'Result: random '+RARITY[maxT+1][zh()?0:1]+' · '+elname(DB[forgeSel[0]].el)):tr('结果：星尘 +8 与 随机上古','Result: +8 Stardust & a random Mythic');$('main').innerHTML=`<section class="page"><div class="content-head"><div><div class="eyebrow">THE FORGE</div><h1>${tr('炼化台','Beast Forge')}</h1><p>${tr('将两只同系神兽投入炼妖炉，凝练出更高阶的神兽，或激荡出觉醒星尘。','Fuse two same-element beasts to forge a higher-tier beast or awaken Stardust.')}</p></div><span class="badge">◇ ${S.jade} ${tr('灵玉','Jade')}</span></div><div class="forge-bar"><button class="btn primary" data-action="forge-do" ${forgeSel.length===2&&sameEl&&S.jade>=60?'':'disabled'}>${tr('炼化','Forge')} · ◇ 60</button><div class="forge-preview">${preview}</div>${forgeSel.length?`<button class="btn secondary" data-action="forge-clear">${tr('清空','Clear')}</button>`:''}</div>${owned.length?`<div class="forge-grid">${owned.map(forgeTile).join('')}</div>`:`<div class="empty">${tr('暂无可用神兽，先去唤灵台结契。','No beasts yet. Bond some in Summon first.')}</div>`}<p class="hint-line">${tr('炼化将消耗所选两只神兽（不可恢复）。灵兽+灵兽→神兽，神兽+神兽→上古；双上古同炉则化为星尘。','Forging consumes both chosen beasts. Spirit+Spirit→Divine, Divine+Divine→Mythic; two Mythics become Stardust.')}</p></section>`;}
function forgeDo(){if(forgeSel.length!==2)return;const [a,b]=forgeSel;if(!S.own[a]||!S.own[b]||a===b)return;if(DB[a].el!==DB[b].el){toast(tr('需同系神兽方可炼化','Fuse beasts of the same element'));return;}if(S.jade<60){toast(tr('灵玉不足（需 60）','Need 60 Jade'));return;}const el=DB[a].el,maxT=Math.max(DB[a].rarity,DB[b].rarity);S.jade-=60;delete S.own[a];delete S.own[b];S.team=S.team.filter(x=>x!==a&&x!==b);let out;if(maxT<2){const pool=DATA.filter(x=>x.rarity===maxT+1&&x.el===el);const nb=pool[Math.floor(Math.random()*pool.length)]||DATA[0];out=obtain(nb.id);}else{S.stardust+=8;const pool=DATA.filter(x=>x.rarity===2&&x.el===el);const nb=pool[Math.floor(Math.random()*pool.length)]||DATA[0];out=obtain(nb.id);}forgeSel=[];save();render();forgeResult(out,maxT);}
function forgeResult(out,maxT){openModal(`${closeButton()}<div class="eyebrow">ALCHEMY OF BEASTS</div><h2>${tr('炼化大成','Fusion complete')}</h2><p>${maxT<2?tr('两兽合一，灵性升华，凝成一头上古之兽的雏形。','Two spirits merge and ascend into a higher form.') : tr('双上古同炉，神力激荡，星尘飞涌。','Two Mythics collide, showering Stardust.')}</p><div class="reveal-grid single"><div>${card(DB[out.id],{new:out.isNew})}</div></div>${maxT>=2?`<p style="color:var(--gold);text-align:center">✦ ${tr('星尘 +8','Stardust +8')}</p>`:''}<div class="actions"><button class="btn primary" data-action="close">${tr('继续炼化','Keep forging')} →</button></div>`,'reveal');}
function renderCult(){const realm=REALMS[Math.min(9,S.cult-1)];const need=daoNeed(S.cult);const pct=Math.min(100,Math.round(S.dao/need*100));const cb=cultBuff();const cost=cultCost();const gain=cultGain();$('main').innerHTML=`<section class="page"><div class="cult-hero"><div class="art">${artHero()}</div><div><div class="eyebrow">THE CULTIVATOR · 主角</div><div class="cult-realm">${tr(realm[0],realm[1])} <small>${tr('第 '+S.cult+' 重','Layer '+S.cult)}</small></div><p class="cult-lore">${tr('你是遗失绘卷的执笔人，以上古修炼之法温养万兽之契。修为愈深，三兽同行的力量愈强。','You are the scribe of the lost scroll. The deeper your cultivation, the stronger your bonded beasts fight beside you.')}</p><div class="dao-meter"><i style="width:${pct}%"></i></div><div class="dao-row"><span>${tr('道行','Dao')} ${S.dao} / ${need}</span><span>${S.cult>=10?tr('已臻化境','Apex reached'):''}</span></div><div class="cult-buffs"><div><small>${tr('全队攻击','Party ATK')}</small><b>+${Math.round((cb.atk-1)*100)}%</b></div><div><small>${tr('全队生命','Party HP')}</small><b>+${Math.round((cb.hp-1)*100)}%</b></div><div><small>${tr('已渡劫','Breakthroughs')}</small><b>${S.cult-1}</b></div></div><button class="btn primary" data-action="cult-do" ${S.essence<cost?'disabled':''}>${tr('静修 · 耗 ✧ '+cost+' 灵蕴 → 道行 +'+gain,'Meditate · ✧ '+cost+' Essence → +'+gain+' Dao')}</button></div></div></section>`;}
function renderExplore(){if(S.battle){renderBattle();return;}const r=REGIONS[region],run=S.run;const step=run?run.step:0;const labels=[tr('林径','Trail'),tr('岔路','Fork'),tr('遗迹','Relic'),tr('兽巢','Lair'),tr('首领','Boss')];$('main').innerHTML=`<section class="page"><div class="content-head"><div><div class="eyebrow">BEYOND THE MIST</div><h1>${tr('踏入山海','Beyond the mist')}</h1><p>${tr('一段旅途，三位同伴。选择你的道路。','One journey. Three companions. Choose your path.')}</p></div><span class="badge">${tr('三兽共鸣','Party resonance')} · ${new Set(S.team.map(id=>DB[id].el)).size>=3?tr('三行同辉 · 生命 +12%','Triad · +12% health'):tr('三种五行可激活','Use 3 different elements')}</span></div>${teamStrip()}${teamHint()}<div class="expedition"><div class="map-panel"><div class="landscape">${landscape()}</div><div class="map-inner"><div class="region-switch">${REGIONS.map((rr,i)=>`<button data-action="region" data-n="${i}" class="${region===i?'active':''}" ${i>S.unlocked||run&&run.region!==i?'disabled':''}>${i>S.unlocked?'◇ ':''}${rr.name[zh()?0:1].split(' · ')[0]}</button>`).join('')}</div><h2 class="map-title">${r.name[zh()?0:1]}</h2><p class="map-sub">${r.desc[zh()?0:1]}</p><div class="route">${labels.map((l,i)=>`<div class="node ${i<step?'done':''} ${i===step?'current':''} ${i===4?'boss':''}"><b><i>${i<step?'✓':i===4?'凶':i+1}</i></b><span>${l}</span></div>`).join('')}</div>${!run?`<button class="btn primary" data-action="begin" ${S.team.length<1?'disabled':''}>${tr('进入秘境','Enter the mist')} →</button><p class="hint-line">${tr('无体力限制 · 重复探索可持续获得资源','No energy limit · Replay expeditions to earn resources')}</p>`:choicesMarkup(run)}${run?`<div class="buffs">${tr('本次祝福','Blessings')}: ${run.atk?tr('攻击','ATK')+' +'+Math.round(run.atk*100)+'% ':''}${run.hp?tr('生命','HP')+' +'+Math.round(run.hp*100)+'% ':''}${run.heal?tr('战后恢复','Recovery')+' +'+Math.round(run.heal*100)+'% ':''}${!run.atk&&!run.hp&&!run.heal?tr('尚未获得','None yet'):''}</div>`:''}</div></div><aside class="journal"><div class="eyebrow">GUARDIAN OF THI function showDetail(id){const b=DB[id];if(!b)return;selected=id;const o=S.own[id],st=o?stats(id):null;openModal(`${closeButton()}<div class="detail"><div class="detail-grid"><div class="detail-art">${art(id,true)}</div><div><div class="eyebrow">${rarity(b.rarity)} / ${elname(b.el)} / ${ROLES[role(id)][2]} ${rname(role(id))}</div><h2>${name(b)}</h2><p>${zh()?b.title:b.titleEn}</p>${o?`<div class="stats"><div><small>${tr('等级','Level')}</small>${o.lv}<span style="font-size:12px;color:var(--muted)"> / 15</span></div><div><small>${tr('生命','Health')}</small>${st.max}</div><div><small>${tr('攻击','Attack')}</small>${st.atk}</div><div><small>${tr('觉醒','Awakened')}</small>${'✦'.repeat(o.star)}</div></div>`:`<div class="notice">${tr('尚未结契。在唤灵台召唤，或完成对应区域的首领挑战。','Not yet bonded. Summon this spirit or earn it from a realm guardian.')}</div>`}<div class="skill-box"><strong>${ROLES[role(id)][2]} ${rname(role(id))}</strong><p>${ROLES[role(id)][zh()?5:6]}</p></div><div class="skill-box"><strong>${SKILLS[b.skill][zh()?0:1]}</strong><p>${SKILLS[b.skill][zh()?2:3]}</p></div><p class="origin">${tr('文献线索：《山海经·','Inspired by the Classic of Mountains and Seas · ')}${b.origin}${tr('》。插画与技能为游戏原创改编。','. Illustrations and abilities are creative adaptations.')}</p></div></div>${o?`<div class="actions"><button class="btn primary" data-action="level" data-id="${id}" ${o.lv>=15||S.essence<cost(id)||S.battle?'disabled':''}>${tr('升级','Level up')} · ✧ ${cost(id)}</button><button class="btn secondary" data-action="awaken" data-id="${id}" ${o.star>=3||S.stardust<o.star*2||S.battle?'disabled':''}>${tr('觉醒','Awaken')} · ✦ ${o.star*2}</button><button class="btn secondary" data-action="team" data-id="${id}" ${S.battle?'disabled':''}>${S.team.includes(id)?tr('离队','Remove'):tr('加入队伍','Add to party')}</button></div><p class="hint-line">${tr('升级增强生命与攻击；每次觉醒全属性 +20%。重复召唤获得通用星尘。','Leveling improves health and attack. Each awakening adds 20% to stats. Duplicate summons grant universal Stardust.')} ${S.battle?tr('战斗期间无法调整队伍。','Party changes are locked during battle.'):''}</p>`:''}</div>`,'detail');}
function obtain(id){const isNew=!S.own[id];if(isNew)S.own[id]={lv:1,star:1};else S.stardust++;return{id,isNew};}

function summon(n){if(!S.started||busy||S.battle||![1,3].includes(n)||S.jade<n*100)return;S.jade-=n*100;const out=[];for(let i=0;i<n;i++){const roll=Math.random();let r=S.pity>=9?2:roll<.08?2:roll<.35?1:0;const pool=DATA.filter(b=>b.rarity===r);const b=pool[Math.floor(Math.random()*pool.length)];S.pity=r===2?0:S.pity+1;S.pulls++;out.push(obtain(b.id));}save();render();reveal(out,false);}
function reveal(out,first){tone('summon');openModal(`${closeButton()}<div class="eyebrow">A NEW CHAPTER BEGINS</div><h2>${first?tr('三兽相伴 · 山海启程','Three bonds. One journey.'):tr('山海回应了你的呼唤','The spirits have answered')}</h2><p>${first?tr('初始三兽已自动上阵。前往青丘，赢得你的第一份首领契约。','Your starter party is ready. Enter Qingqiu and earn your first guardian bond.'):tr('每一次相遇，都是绘卷的新篇。','Every encounter writes a new line in your scroll.')}</p><div class="reveal-grid ${out.length===1?'single':''}">${out.map((x,i)=>`<div style="animation-delay:${i*.12}s">${card(DB[x.id],{new:x.isNew})}</div>`).join('')}</div><div class="actions"><button class="btn primary" data-action="reveal-done">${tr('带着神兽去探险','Take your beasts exploring')} →</button><button class="btn secondary" data-action="close">${tr('继续结契','Back to summoning')}</button></div>`,'reveal');}
function stats(id,run=null){const b=DB[id],o=S.own[id]||{lv:1,star:1};const cb=cultBuff();const scale=(1+(o.lv-1)*.115)*(1+(o.star-1)*.2);const triad=new Set(S.team.map(x=>DB[x].el)).size>=3?1.12:1;const R=ROLES[role(id)];return {max:Math.round((310+b.rarity*35)*scale*triad*(1+(run?.hp||0))*R[3]*cb.hp),atk:Math.round((40+b.rarity*5)*scale*(1+(run?.atk||0))*R[4]*cb.atk)};}
function startRun(){if(S.run||!S.started||S.team.length<1||region>S.unlocked)return;S.run={region,step:0,atk:0,hp:0,heal:0,health:{}};S.team.forEach(id=>S.run.health[id]=1);save();render();}
function choose(id){if(!S.run||S.battle)return;const step=S.run.step;const allowed=step===0?['fight']:step===1?['elite','camp','cache']:step===2?['relic']:step===3?['fight','elite']:['boss'];if(!allowed.includes(id))return;if(['fight','elite','boss'].includes(id)){startBattle(id);return;}if(id==='relic'){blessings();return;}if(id==='camp'){S.team.forEach(x=>S.run.health[x]=1);S.essence+=60;toast(tr('灵泉恢复全队 · 灵蕴 +60','Party restored · +60 Essence'));}else{S.jade+=100;S.stardust++;toast(tr('发现遗宝 · 灵玉 +100 · 星尘 +1','Cache found · +100 Jade · +1 Stardust'));}S.run.step++;save();render();}
function blessings(){openModal(`<div class="eyebrow">ANCIENT BLESSINGS</div><h2>${tr('古祠回应','The shrine answers')}</h2><p>${tr('选择一项祝福，在本次旅途中持续生效。','Choose a blessing for the rest of this expedition.')}</p><div class="blessing">${[['atk','烈风之契','Gale Pact','全队攻击 +25%','Party attack +25%'],['hp','山岳之契','Mountain Pact','全队生命上限 +30%','Party maximum health +30%'],['heal','回春之契','Renewal Pact','战后额外恢复 25% 生命','Recover 25% extra health after battles']].map(([id,z,e,d,de])=>`<button class="choice" data-action="bless" data-id="${id}"><strong>✧ ${tr(z,e)}</strong><small>${tr(d,de)}</small></button>`).join('')}</div>`,'blessing',true);}
function bless(id){if(!S.run||S.run.step!==2||!['atk','hp','heal'].includes(id))return;S.run[id]+={atk:.25,hp:.3,heal:.25}[id];S.run.step++;modalKind='';$('modal').innerHTML='';save();render();tone();}
function unit(id,side,i,power=1){const b=DB[id];const st=side===0?stats(id,S.run):{max:Math.round((240+b.rarity*28)*power),atk:Math.round((32+b.rarity*4)*power)};return {id,key:(side?'e':'p')+i,side,max:st.max,hp:side===0?Math.max(1,Math.round(st.max*(S.run.health[id]??1))):st.max,atk:st.atk,shield:0,poison:0,stun:0,turns:0,boost:0,revived:false};}
function startBattle(kind){const run=S.run;if(!run||S.battle)return;const rr=REGIONS[run.region],factor=1+Math.min(run.region,2)*.30+Math.max(0,run.region-2)*.2+(run.step===3?.16:0)+(kind==='elite'?.20:0);const ids=kind==='boss'?[rr.enemies[0],rr.boss,rr.enemies[1]]:run.step===0?[rr.enemies[0],rr.enemies[2]]:[rr.enemies[0],rr.enemies[1],rr.enemies[2]];S.battle={kind,party:S.team.map((id,i)=>unit(id,0,i)),enemies:ids.map((id,i)=>unit(id,1,i,factor*(kind==='boss'?(i===1?2.1:.72):1))),queue:[],turn:0,energy:45,night:false,result:null,log:tr('灵契已成。每次行动积攒灵力，满 60 可施放御灵术。','Bonds ready. Actions build Spirit; cast Spirit Ward at 60.'),cast:0};paused=false;lastTick=performance.now();save();render();}
function alive(a){return a.filter(u=>u.hp>0);}
function weakest(a){return alive(a).sort((a,b)=>a.hp/a.max-b.hp/b.max)[0];}
function strongest(a){return alive(a).sort((a,b)=>b.atk-a.atk)[0];}
function damage(u,target,amount,ignore=false){if(!target||target.hp<=0)return;const battle=S.battle;const advantage=BEATS[DB[u.id].el]===DB[target.id].el?1.25:BEATS[DB[target.id].el]===DB[u.id].el?.85:1;let n=Math.round(amount*(ignore?1:advantage)*(battle.night&&u.side===1?.8:1));if(target.side===0&&role(target.id)==='tank')n=Math.round(n*.8);const absorbed=Math.min(target.shield,n);target.shield-=absorbed;n-=absorbed;target.hp=Math.max(0,target.hp-n);lastFloats.push([target.key,'−'+n]);targets.push(target.key);if(target.hp===0&&DB[target.id].skill==='flame'&&!target.revived){target.hp=Math.round(target.max*.32);target.revived=true;lastFloats.push([target.key,tr('重生','REBORN')]);}}
function heal(u,amount){if(!u||u.hp<=0)return;const h=Math.min(u.max-u.hp,Math.round(amount));u.hp+=h;if(h>0)lastFloats.push([u.key,'+'+h]);}
function execute(u){const b=S.battle;if(!b||u.hp<=0)return;const allies=u.side?b.enemies:b.party,enemies=u.side?b.party:b.enemies;const beast=DB[u.id];acting=u.key;targets=[];lastFloats=[];if(u.poison>0){u.poison--;u.hp=Math.max(0,u.hp-Math.round(u.max*.045));lastFloats.push([u.key,tr('毒','POISON')]);if(!u.hp){b.log=name(beast)+tr('被毒雾击倒',' falls to venom');return;}}
if(u.stun>0){u.stun--;b.log=name(beast)+tr('受到控制，错过行动',' misses an action');return;}u.turns++;const a=u.atk*(1+u.boost);if(beast.skill==='stone')u.boost=Math.min(.8,u.boost+.1);const special=u.turns%3===(role(u.id)==='ctl'?1:0)||u.turns===1&&(beast.skill==='charm'||beast.skill==='rain');const target=(u.side===0&&b.focus&&enemies.find(x=>x.key===b.focus&&x.hp>0))||(u.side===1&&alive(enemies).find(x=>role(x.id)==='tank'))||weakest(enemies);if(!target)return;b.log=name(beast)+' · '+(special?SKILLS[beast.skill][zh()?0:1]:tr('灵击','Spirit strike'));
if(!special)damage(u,target,a);else switch(beast.skill){
case 'charm':{let t=strongest(enemies);damage(u,t,a*1.25);t.stun=1;break;}
case 'rain':alive(enemies).forEach(t=>damage(u,t,a*.8));alive(allies).forEach(t=>heal(t,a*.5));break;
case 'stone':damage(u,target,a*2.1);break;
case 'night':b.night=!b.night;alive(enemies).forEach(t=>damage(u,t,a*(b.night?.85:1.6)));break;
case 'poison':alive(enemies).forEach(t=>{damage(u,t,a*.7);if(t.hp>0)t.poison=3;});break;
case 'dance':alive(allies).forEach(t=>t.boost=Math.min(.8,t.boost+.12));weakest(allies).shield+=Math.round(a*1.2);break;
case 'flame':alive(enemies).forEach(t=>damage(u,t,a*1.05));break;
case 'guard':alive(allies).forEach(t=>t.shield=Math.min(t.max*.6,t.shield+Math.round(a*1.1)));break;
case 'heal':{const t=weakest(allies);heal(t,a*2.4);t.poison=0;break;}
case 'strike':damage(u,target,a*2.4);break;
case 'freeze':{const t=strongest(enemies);damage(u,t,a*1.25);t.stun=1;break;}
case 'thunder':alive(enemies).forEach(t=>damage(u,t,a*.85));if(Math.random()<.5&&strongest(enemies))strongest(enemies).stun=1;break;
}if(u.side===0)b.energy=Math.min(100,b.energy+9+(role(u.id)==='sup'?5:0));tone('hit');}
function tick(){const b=S.battle;if(!b||b.result)return;if(!b.queue.length){const p=alive(b.party),e=alive(b.enemies);for(let i=0;i<Math.max(p.length,e.length);i++){if(p[i])b.queue.push(p[i].key);if(e[i])b.queue.push(e[i].key);}}const key=b.queue.shift();const u=[...b.party,...b.enemies].find(x=>x.key===key);if(u)execute(u);b.turn++;if(!alive(b.enemies).length){finishBattle(true);return;}if(!alive(b.party).length||b.turn>=220){finishBattle(false);return;}save();renderBattle();renderHeader();}
function ward(){const b=S.battle;if(!b||b.result||b.energy<60||paused||modalKind)return;b.energy-=60;b.cast++;lastFloats=[];targets=[];acting='';alive(b.party).forEach(u=>{heal(u,u.max*.23);u.poison=0;u.stun=0;u.shield=Math.min(u.max*.6,u.shield+Math.round(u.max*.12));});b.log=tr('御灵术 · 净化毒雾，恢复生命，护佑三兽。','Spirit Ward · Cleanse, restore health and shield your party.');tone('summon');save();renderBattle();}
function fighter(u,i){const b=DB[u.id];return `<div ${u.side&&u.hp>0?`data-action="focus" data-id="${u.key}" role="button" tabindex="0" style="cursor:pointer"`:''} class="fighter ${S.battle.focus===u.key&&u.hp>0?'focused':''} ${i===1?'lead':''} ${u.hp<=0?'dead':''} ${acting===u.key?'acting':''} ${targets.includes(u.key)?'target':''}"><div class="art">${art(u.id)}</div><h3>${name(b)} <span title="${rname(role(u.id))}">${ROLES[role(u.id)][2]}</span></h3><div class="hp"><i style="width:${Math.max(0,u.hp/u.max*100)}%"></i></div><div class="status">${u.hp>0?`${S.battle.focus===u.key?'🎯 ':''}${u.hp}/${u.max}${u.shield?' ◇'+u.shield:''}${u.poison?' ☠':''}${u.stun?' ❄':''}`:tr('已倒下','Fallen')}</div>${lastFloats.filter(f=>f[0]===u.key).map(f=>`<span class="float-text">${f[1]}</span>`).join('')}</div>`;}
function renderBattle(){const b=S.battle;if(!b)return;const boss=b.kind==='boss';$('main').innerHTML=`<section class="page" style="animation:none"><div class="content-head"><div><div class="eyebrow">${boss?'GUARDIAN ENCOUNTER':'SPIRITS IN CONFLICT'}</div><h1>${boss?name(DB[REGIONS[S.run.region].boss]):tr('雾中交锋','Clash in the mist')}</h1><p>${REGIONS[S.run.region].name[zh()?0:1]} · ${tr('旅途','Journey')} ${S.run.step+1} / 5</p></div><span class="badge">${tr('点敌人集火 · 手动御灵','Tap an enemy to focus · Cast Spirit Ward')}</span></div><div class="battle ${b.night?'night':''}"><div class="landscape">${landscape()}</div><div class="battle-header"><strong>${b.night?tr('烛龙闭目 · 永夜降临','NIGHTFALL'):boss?tr('首领试炼','GUARDIAN TRIAL'):tr('三兽同心','BOUND TOGETHER')}</strong><div class="controls"><button data-action="speed">${speed}×</button><button data-action="pause">${paused?tr('继续','Resume'):tr('暂停','Pause')}</button><button data-action="retreat">${tr('撤退','Retreat')}</button></div></div><div class="arena"><div class="squad">${b.party.map(fighter).join('')}</div><div class="versus">vs</div><div class="squad enemy">${b.enemies.map(fighter).join('')}</div></div><div class="battle-log" role="status">${paused?tr('战斗已暂停','Battle paused'):b.log}</div><div class="battle-actions"><button class="btn spell" data-action="ward" ${b.energy<60||paused||b.result?'disabled':''}>✧ ${tr('御灵术','Spirit Ward')} <span>${Math.floor(b.energy)} / 60</span></button><small>${tr('恢复 · 净化 · 护盾<br>灵力随神兽行动恢复','Heal · Cleanse · Shield<br>Spirit builds with allied actions')}</small><div class="meter" style="width:90px;height:4px"><i style="width:${b.energy}%"></i></div></div></div><div class="battle-help"><span>${tr('建议：敌方释放毒雾后，再使用御灵术净化全队。','Tip: use Spirit Ward after poison lands to cleanse your entire party.')}</span><span>${matchMedia('(hover:hover)').matches?tr('空格：御灵术 · P：暂停','Space: Spirit Ward · P: Pause'):tr('点敌人集火','Tap an enemy to focus fire')}</span></div></section>`;}
function finishBattle(win){const b=S.battle;if(!b||b.result)return;const boss=b.kind==='boss',r=S.run.region,first=boss&&S.clears[r]===0;let jade=win?(boss?240:b.kind==='elite'?140:80):40,essence=win?(boss?240:b.kind==='elite'?120:80):60;if(win&&first)jade=400;S.jade+=jade;S.essence+=essence;let reward=null;if(win&&boss){S.stardust+=2;S.clears[r]++;S.unlocked=Math.min(REGIONS.length-1,Math.max(S.unlocked,r+1));if(first)reward=obtain(REGIONS[r].reward);CG.celebrate();}if(win)b.party.forEach(u=>S.run.health[u.id]=Math.min(1,Math.max(.25,u.hp/u.max)+.16+S.run.heal));gainDao(win?(boss?40:b.kind==='elite'?25:15):8);b.result={win,jade,essence,boss,first,reward};save();renderBattle();renderHeader();tone(win?'win':'tap');showResult();}
function showResult(){const x=S.battle?.result;if(!x)return;openModal(`<div class="result"><div class="eyebrow">${x.win?'A BOND MADE STRONGER':'THE SCROLL REMEMBERS'}</div><div class="sigil">${x.win?'契':'归'}</div><h2>${x.win?(x.boss?tr('此境已定 · 新契已成','A realm restored. A new bond.'):tr('破雾得胜','The mist gives way')):tr('归途亦有收获','Every journey teaches')}</h2><p>${x.win?tr('每一次并肩，都让契约更加坚定。','With every shared victory, your bonds grow stronger.'):tr('升级或更换阵容后再来。保留已获资源，并领取本次探险补给。','Keep your rewards. Level up or change your party, then try again.')}</p><div class="rewards"><div>◇ ${x.jade}<small>${tr('灵玉','Jade')}</small></div><div>✧ ${x.essence}<small>${tr('灵蕴','Essence')}</small></div>${x.win&&x.boss?`<div>✦ 2<small>${tr('星尘','Stardust')}</small></div>`:''}</div>${x.reward?`<p style="color:var(--gold)">${tr('首通契约','First-clear bond')} · ${name(DB[x.reward.id])}${!x.reward.isNew?tr('（重复转为星尘）',' (duplicate → Stardust)'):''}</p>`:''}${CG.ready&&x.win&&!x.doubled?`<button class="btn secondary" data-action="adx2" style="margin-right:8px">${tr('观看广告 · 奖励翻倍','Watch an ad · double rewards')}</button>`:''}<button class="btn primary" data-action="continue">${x.win&&!x.boss?tr('继续旅途','Continue the journey'):tr('返回山海','Return to the map')} →</button></div>`,'result',true);}
function continueJourney(){const x=S.battle?.result;if(!x)return;if(x.win&&!x.boss)S.run.step++;else S.run=null;S.battle=null;paused=false;acting='';targets=[];lastFloats=[];modalKind='';$('modal').innerHTML='';save();render();CG.ad('midgame',()=>{});}
function settings(){openModal(`${closeButton()}<div class="eyebrow">SETTINGS</div><h2>${tr('行囊与设置','Travel settings')}</h2><div class="settings-row"><span>${tr('界面语言','Language')}</span><button data-action="lang">${tr('简体中文 → English','English → 简体中文')}</button></div><div class="settings-row"><span>${tr('灵音音效','Sound effects')}</span><button data-action="sound">${S.sound?tr('已开启','On'):tr('已关闭','Off')}</button></div><div class="settings-row"><span>${tr('减少动效','Reduced motion')}</span><button data-action="calm">${S.calm?tr('已开启','On'):tr('已关闭','Off')}</button></div><div class="settings-row"><span>${tr('存档','Save data')}</span><span class="muted">${storageOK?tr('自动保存','Saved automatically'):tr('保存不可用','Unavailable')}</span></div><div class="notice">${tr('试玩版 · '+DATA.length+' 只可收集神兽 · '+REGIONS.length+' 个探索区域。无体力限制，广告只在关卡之间出现。原创剪纸风插画；神话技能为创作改编。','Playable build · '+DATA.length+' collectible beasts · '+REGIONS.length+' realms. No energy gates. Ads only appear between stages. Original paper-cut illustrations and adapted mythic abilities.')}</div><div class="actions"><button class="btn secondary" data-action="reset-confirm">${tr('重新开始','Reset progress')}</button></div>`,'settings',true);}
function about(){openModal(`${closeButton()}<div class="eyebrow">SHANHAI · BEASTBOUND</div><h2>${tr('万物有灵，山海有契','A world of kindred spirits')}</h2><p>${tr('你是遗失绘卷的修复者。与异兽缔结契约，组成三兽小队，探索青丘、丹穴与昆仑。','You restore a forgotten scroll. Bond with ancient spirits, form a party of three, and explore Qingqiu, Danxue and Kunlun.')}</p><div class="notice">${tr('① 在唤灵台用灵玉召唤你的第一只神兽。<br>② 在山海行选择路线，战斗会自动进行。<br>③ 灵力达到 60 时，点击御灵术恢复、净化、护盾。<br>④ 使用灵蕴升级，重复神兽转为星尘用于觉醒。<br>⑤ 首次击败区域首领，即可与它结契。','① Summon your first beast with Jade in Summon.<br>② Choose a route in Explore; attacks happen automatically.<br>③ At 60 Spirit, use Spirit Ward to heal, cleanse and shield.<br>④ Level up with Essence; duplicates grant awakening Stardust.<br>⑤ Defeat a realm guardian for the first time to earn its bond.<br>⑥ Cultivate (修行) to grow stronger with every breakthrough.<br>⑦ Forge (炼化) same-element beasts into higher forms.')}</div><p style="margin-top:16px">${tr('本作取材于《山海经》，角色造型、战斗技能及剧情为游戏改编。图鉴提供文献线索，不把原创设定当作原典记载。','Inspired by the Classic of Mountains and Seas. Character art, combat powers and story are creative adaptations, not direct claims about the original text.')}</p><div class="actions"><button class="btn primary" data-action="close">${tr('展开绘卷','Unfurl the scroll')} →</button></div>`,'about',true);}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches?.('.fighter[data-action]'))e.target.click();});
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const a=btn.dataset.action,id=btn.dataset.id,n=Number(btn.dataset.n);tone();switch(a){
case 'tab':if(S.battle&&id!=='explore'){toast(tr('请先完成战斗，或撤退后调整队伍。','Finish or retreat from the battle first.'));break;}tab=id;render();break;
case 'lang':S.lang=zh()?'en':'zh';save();render();if(modalKind==='settings')settings();else if(modalKind==='detail')showDetail(selected);else if(modalKind==='about')about();break;
case 'calm':S.calm=!S.calm;save();render();if(modalKind==='settings')settings();break;
case 'sound':S.sound=!S.sound;save();tone();renderHeader();if(modalKind==='settings')settings();break;
case 'settings':settings();break;case 'about':about();break;case 'close':closeModal();break;
case 'guide':guide();break;case 'start':S.started=true;save();tab='summon';render();break;
case 'focus':{const bb=S.battle;if(bb&&!bb.result){bb.focus=bb.focus===id?null:id;renderBattle();}break;}
case 'summon':summon(n);break;
case 'adjade':CG.ad('rewarded',ok=>{if(ok){S.jade+=100;save();renderHeader();if(tab==='summon')renderSummon();toast(tr('获得 100 灵玉','+100 Jade'));}else toast(tr('暂时没有广告，请稍后再试','No ad available right now.'));});break;
case 'adx2':CG.ad('rewarded',ok=>{const x=S.battle?.result;if(ok&&x&&!x.doubled){S.jade+=x.jade;S.essence+=x.essence;x.doubled=true;save();renderHeader();showResult();}else if(!ok)toast(tr('暂时没有广告，请稍后再试','No ad available right now.'));});break;
case 'reveal-done':closeModal();tab='explore';render();break;
case 'detail':showDetail(id);break;
case 'filter':filter=id;renderCodex();break;
case 'level':if(S.battle||!S.own[id]||S.own[id].lv>=15||S.essence<cost(id))break;S.essence-=cost(id);S.own[id].lv++;save();render();showDetail(id);break;
case 'awaken':if(S.battle||!S.own[id]||S.own[id].star>=3||S.stardust<S.own[id].star*2)break;S.stardust-=S.own[id].star*2;S.own[id].star++;save();render();showDetail(id);tone('summon');break;
case 'team':if(S.battle||!S.own[id])break;if(S.team.includes(id))S.team=S.team.filter(x=>x!==id);else if(S.team.length<3)S.team.push(id);else{toast(tr('队伍已满，请先让一位同伴离队。','Party full. Remove a companion first.'));break;}save();render();showDetail(id);break;
case 'region':if(!S.run&&n<=S.unlocked){region=n;renderExplore();}break;
case 'begin':startRun();break;case 'choice':choose(id);break;case 'bless':bless(id);break;
case 'ward':ward();break;
case 'pause':paused=!paused;lastTick=performance.now();CG.sync();renderBattle();break;
case 'speed':speed=speed===1?2:1;renderBattle();break;
case 'continue':continueJourney();break;
case 'retreat':openModal(`${closeButton()}<h2>${tr('暂别此境？','Leave this expedition?')}</h2><p>${tr('已获得的灵玉与灵蕴全部保留。本次祝福与探索进度将结束。','Keep all earned Jade and Essence. This expedition and its blessings will end.')}</p><div class="actions"><button class="btn secondary" data-action="close">${tr('继续战斗','Keep fighting')}</button><button class="btn primary" data-action="retreat-yes">${tr('返回山海','Return to map')}</button></div>`,'retreat',true);break;
case 'retreat-yes':S.battle=null;S.run=null;paused=false;save();closeModal();render();break;
case 'reset-confirm':openModal(`${closeButton()}<h2>${tr('重新展开绘卷？','Start a new scroll?')}</h2><p>${tr('这会删除本版本的全部收集与探险进度。此操作无法撤销。','This deletes all collection and expedition progress in this version. This cannot be undone.')}</p><div class="actions"><button class="btn primary" data-action="close">${tr('保留进度','Keep progress')}</button><button class="btn secondary danger" data-action="reset-yes">${tr('删除并重新开始','Delete and restart')}</button></div>`,'reset',true);break;
case 'reset-yes':{const l=S.lang;S=fresh();S.lang=l;tab='summon';region=0;filter='all';paused=false;closeModal();save();render();break;}
case 'cult-do':{const cost=cultCost();if(S.battle||S.essence<cost)break;S.essence-=cost;const broke=gainDao(cultGain());save();render();if(broke)tone('summon');toast(broke?tr('突破！修为精进','Breakthrough! Cultivation advanced'):tr('道行 +'+cultGain(),'+'+cultGain()+' Dao'));break;}
case 'forge-pick':{if(!S.own[id])break;if(forgeSel.includes(id))forgeSel=forgeSel.filter(x=>x!==id);else forgeSel=forgeSel.length>=2?[id]:[...forgeSel,id];render();break;}
case 'forge-clear':forgeSel=[];render();break;
case 'forge-do':forgeDo();break;
}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return;}if(modalKind){if(e.key==='Tab'){const items=[...$('modal').querySelectorAll('button:not(:disabled)')];if(!items.length)return;const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}if(!S.battle||S.battle.result||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();ward();}if(e.key.toLowerCase()==='p'){paused=!paused;CG.sync();renderBattle();}});
addEventListener('pagehide',()=>{save();flushCloud();});
document.addEventListener('visibilitychange',()=>{lastTick=performance.now();CG.sync();if(document.hidden){save();flushCloud();audio?.suspend();}else if(S.sound&&!CG.forcedMute)audio?.resume();});
function loop(t){if(S.battle&&!S.battle.result&&!paused&&!modalKind&&!document.hidden&&t-lastTick>850/speed){lastTick=t;tick();}requestAnimationFrame(loop);}
render();if(S.battle?.result)showResult();else if(!S.guide){S.guide=true;save();guide();}requestAnimationFrame(loop);
// Optional CrazyGames integration. Offline play never waits for the SDK.
if(location.protocol==='https:'&&/(^|\.)crazygames\.(com|dev)$/.test(location.hostname)){const s=document.createElement('script');s.src='https://sdk.crazygames.com/crazygames-sdk-v3.js';s.onload=()=>CG.init();s.async=true;document.head.appendChild(s);}
</script></body></html>
